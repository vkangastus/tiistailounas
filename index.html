<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiistain Lounaslistat</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; color: #333; padding: 20px; }
        h1 { text-align: center; color: #2c3e50; }
        .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; max-width: 1200px; margin: 20px auto; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card h2 { color: #2980b9; border-bottom: 2px solid #eee; padding-bottom: 8px; margin-top: 0; }
        ul { padding-left: 20px; }
        li { margin-bottom: 6px; line-height: 1.4; }
        a { color: #2980b9; text-decoration: none; }
    </style>
</head>
<body>

    <h1>Tiistain Lounaat</h1>
    <div class="container" id="lunch-container">Ladataan...</div>

    <script>
        async function lataaLounaat() {
            const container = document.getElementById('lunch-container');
            try {
                // Haetaan staattinen lounaat.json (välimuistin ohitus cache-bustingilla)
                const res = await fetch(`lounaat.json?t=${Date.now()}`);
                const data = await res.json();
                
                container.innerHTML = '';
                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    const listItems = item.lounaat.map(l => `<li>${l}</li>`).join('');
                    card.innerHTML = `
                        <h2><a href="${item.url}" target="_blank">${item.nimi}</a></h2>
                        <ul>${listItems}</ul>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                container.innerHTML = '<p style="color:red;">Lounaslistojen lataus epäonnistui.</p>';
            }
        }

        window.onload = lataaLounaat;
    </script>
</body>
</html>
